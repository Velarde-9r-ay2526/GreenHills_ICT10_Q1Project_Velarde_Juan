<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>
    
    <!-- Link CSS and PyScript -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">Skewer</div>
        <nav>
            <a href="index.html" class="active">📊 SKU Generator</a>
            <a href="receipt.html">🧾 Receipt Generator</a>
        </nav>
    </header>

    <!-- Main Card -->
    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2>SKU Generator</h2>
                <p>Miguel's Donut Shop</p>
            </div>
            
            <div class="card-body">
                <label for="category">Category</label>
                <select id="category">
                    <option value="GLZ">Glazed Donuts</option>
                    <option value="FIL">Filled Donuts</option>
                    <option value="DRP">Donut Holes</option>
                    <option value="SPC">Specialty</option>
                    <option value="BEV">Drinks</option>
                </select>

                <label for="prod_name">Product Name</label>
                <input type="text" id="prod_name" value="Miguel's Donut Shop">

                <label for="stock_qty">Stock Quantity</label>
                <input type="number" id="stock_qty" placeholder="e.g. 50">

                <button type="submit" py-click="generate_sku" class="btn">Generate SKU</button>

                <div id="sku_output" class="output-box">
                    Your generated SKU will appear here.
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Footer -->
    <footer class="footer">
        &lt;/&gt; SKU Generator — 1st Quarter Project
    </footer>

    <!-- Python file -->
    <script type="py" src="main.py"></script>
</body>
</html>
