<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    
    <!-- Link CSS and PyScript -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">Skewer</div>
        <nav>
            <a href="index.html">📊 SKU Generator</a>
            <a href="receipt.html" class="active">🧾 Receipt Generator</a>
        </nav>
    </header>

    <!-- Main Card -->
    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2>Miguel's Donut Shop</h2>
                <p>Receipt Generator</p>
            </div>
            
            <div class="card-body">
                <label for="coffee">Select Item</label>
                <select id="coffee">
                    <option value="45">Classic Glazed - ₱45</option>
                    <option value="55">Boston Cream - ₱55</option>
                    <option value="60">Nutella Special - ₱60</option>
                    <option value="120">Iced Coffee - ₱120</option>
                </select>

                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" value="1">

                <button type="submit" py-click="create_order" class="btn">Create Order</button>

                <div id="receipt_output" class="output-box">
                    Your order summary will appear here.
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Footer -->
    <footer class="footer">
        &lt;/&gt; Receipt Generator — 1st Quarter Project
    </footer>

    <!-- Python file -->
    <script type="py" src="main.py"></script>
</body>
</html>
